; Montage Maker Configuration File
; define presets below.
; You can override any of these by passing the argument on the command line.

[Contact Sheet]
grid = 4x4
size = 300x300+5+5
prefix = contact
fontsize = 10
ext = png
labels = on
crop = 300x300

[Filmstrip]
grid = 4x1
size = 480x480+0+0
background = #000000
mode = Concatenate
prefix = filmstrip
fontsize = 12
ext = png
labels = off

[Gallery Wall]
grid = 2x2
size = 500x500+20+20
background = #f0ebe0
prefix = gallery
fontsize = 12
ext = png
labels = off
shadow = on
frame = 8x8+4+4
mattecolor = #c8b89a

[Instagram Post]
grid = 2x2
size = 1080x1080+0+0
prefix = ig_post
fontsize = 12
ext = jpg
labels = off
crop = 1080x1080

[Instagram Story]
